name: Build translation files

on:
  push:
    branches: [main]
    paths:
      - '**/*.php'
      - 'languages/*.po'
      - '.github/workflows/translations.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translation-files-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
      - name: Install WP-CLI
        run: |
          curl -fsSLo wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php wp-cli.phar --info
      - name: Generate POT from theme source
        run: php wp-cli.phar i18n make-pot . languages/vertex-starter.pot --domain=vertex-starter
      - name: Update existing PO catalogues without discarding translations
        run: |
          if [ -f languages/vertex-starter-fa_IR.po ]; then
            php wp-cli.phar i18n update-po languages/vertex-starter.pot languages/vertex-starter-fa_IR.po
          fi
      - name: Compile MO files
        run: php wp-cli.phar i18n make-mo languages
      - name: Commit generated translation files
        run: |
          if [[ -n "$(git status --porcelain -- languages)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add languages/*.pot languages/*.po languages/*.mo
            git commit -m "chore(i18n): regenerate translation files [skip ci]"
            git push origin main
          else
            echo "Translation files are already up to date."
          fi
