name: Sync Vertex

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-vertex.yml"

permissions:
  contents: write

# Serialise workflows that commit generated files to main.
concurrency:
  group: base-theme-main-writes
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Vertex main into vertex/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Add or update Vertex subtree
        shell: bash
        run: |
          set -euo pipefail
          FRAMEWORK_REPOSITORY="https://github.com/vertex-wp/framework.git"
          if git log --all --grep='git-subtree-dir: vertex' --format='%H' -1 | grep -q .; then
            git subtree pull --prefix=vertex "$FRAMEWORK_REPOSITORY" main --squash
          else
            rm -rf vertex
            git subtree add --prefix=vertex "$FRAMEWORK_REPOSITORY" main --squash
          fi
      - name: Push sync commit to main
        run: git push origin HEAD:main
